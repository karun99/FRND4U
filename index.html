<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FRND4U: AI Trauma Support Chat</title>
    <meta name="author" content="NRCM Tutorials, Vijayawada" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              'light-bg': '#eef2f9',
              'dark-bg': '#2c303a',
              'accent': {
                'DEFAULT': '#5b9dff',
                'light': '#a8c7ff',
                'dark': '#3a7ffb',
              },
            },
            boxShadow: {
              'neumorphic-light': '7px 7px 15px #d1d9e6, -7px -7px 15px #ffffff',
              'neumorphic-dark': '7px 7px 15px #242730, -7px -7px 15px #343944',
              'neumorphic-inset-light': 'inset 7px 7px 15px #d1d9e6, inset -7px -7px 15px #ffffff',
              'neumorphic-inset-dark': 'inset 7px 7px 15px #242730, inset -7px -7px 15px #343944',
            },
            animation: {
              'fade-in': 'fade-in 0.5s ease-out forwards',
              'bounce-dot': 'bounce-dot 1.4s infinite ease-in-out both',
            },
            keyframes: {
              'fade-in': {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              'bounce-dot': {
                '0%, 80%, 100%': { transform: 'scale(0)' },
                '40%': { transform: 'scale(1.0)' },
              }
            }
          }
        }
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.13.0",
    "react/": "https://esm.sh/react@^19.1.1/",
    "react": "https://esm.sh/react@^19.1.1",
    "react-dom/": "https://esm.sh/react-dom@^19.1.1/"
  }
}
</script>
</head>
  <body class="bg-light-bg dark:bg-dark-bg font-sans text-slate-700 dark:text-slate-200 antialiased">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
